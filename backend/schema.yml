          type: string
        required: true
      tags:
      - academics
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
  /api/academics/faculty/:
    get:
      operationId: academics_faculty_list
      description: Public API to list and retrieve active faculty members.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - academics
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacultyList'
          description: ''
  /api/academics/faculty/{id}/:
    get:
      operationId: academics_faculty_retrieve
      description: Public API to list and retrieve active faculty members.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this faculty.
        required: true
      tags:
      - academics
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faculty'
          description: ''
  /api/certificates/verify/:
    get:
      operationId: certificates_verify_retrieve
      description: |-
        Public API to verify a certificate by its code.
        GET /api/certificates/verify/?code=XYZ
      tags:
      - certificates
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerification'
          description: ''
  /api/communications/contact/:
    post:
      operationId: communications_contact_create
      description: Public API to submit contact messages.
      tags:
      - communications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactMessage'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessage'
          description: ''
  /api/communications/enquiries/:
    post:
      operationId: communications_enquiries_create
      description: Public API to submit admission enquiries.
      tags:
      - communications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdmissionEnquiry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdmissionEnquiry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdmissionEnquiry'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionEnquiry'
          description: ''
