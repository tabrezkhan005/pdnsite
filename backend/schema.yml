          description: ''
  /api/content/gallery/{id}/:
    get:
      operationId: content_gallery_retrieve
      description: Public API to list and retrieve published gallery items.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this gallery item.
        required: true
      tags:
      - content
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
