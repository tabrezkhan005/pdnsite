openapi: 3.0.3
info:
  title: Perin Devi Natyalayam API
  version: 1.0.0
  description: API for the PDN website and student portal.
paths:
  /api/academics/branches/:
    get:
      operationId: academics_branches_list
      description: Public API to list and retrieve active branches.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - academics
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchList'
          description: ''
  /api/academics/branches/{slug}/:
    get:
      operationId: academics_branches_retrieve
      description: Public API to list and retrieve active branches.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - academics
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/academics/courses/:
